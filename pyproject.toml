[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shapstab"
version = "0.1.0"
description = "Turns a single-fit SHAP feature ranking into a resampling distribution, so a rank is reported as real or as a seed artifact rather than as a fact."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vaishnavi Lolla" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Dev-time extras only. The runtime path and `make verify` never need these.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "scikit-learn>=1.3"]
evidence = ["cmarkgfm>=2023.0", "playwright>=1.40"]

[project.scripts]
shapstab = "shapstab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shapstab = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
