name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with core dependencies only
        run: pip install -e .

      - name: Import without the dev extras
        # Catches a runtime import that secretly depends on a dev-only package. The core
        # must import with numpy alone; scipy and scikit-learn are cross-checks, not deps.
        run: python -c "import shapstab, shapstab.cli, shapstab.ranking, shapstab.stats"

      - name: Install the dev extras
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test with coverage floor
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junitxml=reports/junit.xml \
            --cov=shapstab \
            --cov-report=json:reports/coverage.json \
            --cov-fail-under=100

      - name: Receipts (re-measure figures and check the prose)
        run: |
          python tools/collect_metrics.py --skip-tests
          python tools/check_numbers.py

      - name: Publish the calibration table to the job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          m = json.loads(pathlib.Path("docs/metrics.json").read_text())["metrics"]
          print("### shap-stability, measured this run\n")
          print("| figure | value |")
          print("|---|---|")
          print(f"| verdict on the bundled data | {m['verdict']} |")
          print(f"| top-{m['top_k']} features keeping exact rank | {m['stable_rank_count']} |")
          print(f"| exact top-{m['top_k']} order recurs | {m['exact_topk_prob_pct']}% |")
          print(f"| null single-fit winner (tied features) | {m['null_single_fit_winner_pct']}% |")
          print(f"| tests / line coverage | {m['tests_total']} / {m['coverage_line_pct']}% |")
          PY

      - name: Upload experiment JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiments-${{ matrix.python-version }}
          path: docs/experiments/*.json
